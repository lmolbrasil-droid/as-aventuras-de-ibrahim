name: Importar projeto do aplicativo

on:
  push:
    paths:
      - "As_Aventuras_de_Ibrahim_v143_Netlify.zip"

permissions:
  contents: write

jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Extrair projeto
        run: |
          test -f As_Aventuras_de_Ibrahim_v143_Netlify.zip
          unzip -o As_Aventuras_de_Ibrahim_v143_Netlify.zip -d .
          rm As_Aventuras_de_Ibrahim_v143_Netlify.zip
      - name: Salvar arquivos extraídos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Importa arquivos do aplicativo"
          git push
