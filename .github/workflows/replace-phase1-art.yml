name: Aplicar arte oficial da Fase 1
on:
  push:
    branches: [main]
    paths:
      - "scripts/replace-phase1-art.cjs"
permissions:
  contents: write
jobs:
  replace-art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Substituir somente a arte da Fase 1
        run: |
          node scripts/replace-phase1-art.cjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git diff --cached --quiet || git commit -m "Aplica imagem oficial na capa da Fase 1"
          git push
