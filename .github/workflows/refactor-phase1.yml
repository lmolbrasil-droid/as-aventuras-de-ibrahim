name: Refatorar primeira fase
on:
  push:
    branches: [main]
    paths:
      - "scripts/refactor-phase1.cjs"
permissions:
  contents: write
jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Aplicar estrutura da Fase 1
        run: |
          node scripts/refactor-phase1.cjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Organiza a Fase 1 e estabiliza exploração"
          git push
