<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#173d2b"><title>As Aventuras de Ibrahim · Exploração 2D</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#102d24;color:#fff;font-family:system-ui,Arial,sans-serif;min-height:100vh;display:flex;justify-content:center}.app{width:min(100%,620px);min-height:100vh;background:linear-gradient(#173e30,#0b241d);padding:12px;display:flex;flex-direction:column;gap:10px}.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.top b{font-size:18px}.pill{background:#214d3b;border:1px solid #6ba878;border-radius:20px;padding:7px 12px;font-weight:800}.frame{position:relative;border:4px solid #d8edc4;border-radius:15px;overflow:hidden;background:#5a9d4c;box-shadow:0 8px 24px #0007}.frame canvas{display:block;width:100%;height:auto;image-rendering:pixelated;touch-action:none}.hint{text-align:center;color:#d3e7d0;font-size:13px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:center}.pad{display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(2,44px);gap:4px;justify-content:center}.pad button,.action{border:0;border-radius:12px;background:linear-gradient(#f1d77e,#c99439);color:#422d0b;font-weight:950;box-shadow:0 4px 0 #805b26;touch-action:none}.pad button{font-size:20px}.pad .up{grid-column:2}.pad .left{grid-column:1;grid-row:2}.pad .down{grid-column:2;grid-row:2}.pad .right{grid-column:3;grid-row:2}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.action{min-height:52px;font-size:14px;padding:8px}.action:active,.pad button:active{transform:translateY(2px);box-shadow:0 2px 0 #805b26}.story{background:#163a2d;border:1px solid #4b8058;border-radius:12px;padding:11px;min-height:48px;font-weight:700;text-align:center}.battle{display:none;gap:10px}.battle.active{display:grid}.explore.hidden{display:none}.battlefield{position:relative;min-height:260px;border:4px solid #d8edc4;border-radius:16px;overflow:hidden;background:linear-gradient(#9bd5e7 0 45%,#7cae59 45% 100%)}.battlefield:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 90%,#477d38 0 30%,transparent 31%),linear-gradient(135deg,transparent 45%,#fff2 46% 47%,transparent 48%)}.heroArt{position:absolute;left:7%;bottom:5%;width:34%;height:75%;object-fit:contain;image-rendering:pixelated}.enemyArt{position:absolute;right:4%;bottom:7%;width:39%;height:75%;object-fit:contain;image-rendering:pixelated;filter:drop-shadow(0 8px 5px #1a291c88)}.bars{display:grid;grid-template-columns:1fr 1fr;gap:8px}.bar{background:#173d2d;border:1px solid #67956d;border-radius:12px;padding:9px;font-size:13px;font-weight:900}.meter{height:9px;background:#536c58;border-radius:9px;margin-top:6px;overflow:hidden}.meter i{display:block;height:100%;background:#7be36c;width:100%}.meter.enemy i{background:#ff9d43}.battleBtns{display:grid;grid-template-columns:1fr 1fr;gap:9px}.battleBtns button{min-height:54px;border:0;border-radius:12px;background:linear-gradient(#f5dc91,#d4a64b);color:#49330f;font-weight:950;font-size:15px;box-shadow:0 4px 0 #805b26}.battleBtns button:disabled{opacity:.45}.bag{display:none;background:#173d2d;border:1px solid #67956d;border-radius:12px;padding:10px}.bag.open{display:block}.bag button{margin:5px;padding:9px;border:0;border-radius:9px;font-weight:800}.back{background:#d9e9c7;color:#173d2d;border:0;border-radius:10px;padding:10px;font-weight:900}
</style></head><body><main class="app">
<header class="top"><b>🗺️ As Aventuras de Ibrahim</b><span class="pill" id="phase">FASE 1 · FLORESTA</span></header>
<section class="explore" id="explore"><div class="frame"><canvas id="map" width="480" height="640"></canvas></div><div class="hint">Explore a floresta. O matinho esconde encontros!</div>
<div class="controls"><div class="pad"><button class="up" data-dir="up">▲</button><button class="left" data-dir="left">◀</button><button class="down" data-dir="down">▼</button><button class="right" data-dir="right">▶</button></div><div class="story" id="mapStory">Encontre o caminho ao norte para avançar. Entre no matinho para procurar inimigos.</div></div></section>
<section class="battle" id="battle"><div class="battlefield"><img class="heroArt" src="assets/ibrahim_idle.png" alt="Ibrahim"><img class="enemyArt" src="assets/enemy_guardian.webp" alt="Guardião da Floresta"></div><div class="bars"><div class="bar">❤️ Ibrahim <span id="hpLabel">120/120</span><div class="meter"><i id="hpBar"></i></div></div><div class="bar">👹 Guardião <span id="enemyLabel">40/40</span><div class="meter enemy"><i id="enemyBar"></i></div></div></div><div class="story" id="battleStory">Um Guardião da Floresta apareceu!</div><div class="battleBtns"><button id="attack">⚔️ Ataque</button><button id="defend">🛡️ Defesa</button><button id="double">🐶 Ataque Duplo</button><button id="backpack">🎒 Mochila</button></div><div class="bag" id="bag"><b>Mochila</b><p>🧪 Remédio: recupera 35 de vida.</p><button id="medicine">Usar remédio</button><button id="closeBag">Fechar</button></div><button class="back" id="returnMap">Voltar à exploração</button></section>
</main>
<script>
const canvas=document.getElementById('map'),ctx=canvas.getContext('2d'),W=480,H=640,T=40,cols=12,rows=16;
let px=5,py=11,hp=120,enemyHp=40,guard=false,doubleUsed=false,inBattle=false,won=false,step=0;
const grass=new Set(['2,3','3,3','4,3','2,4','3,4','4,4','8,5','9,5','8,6','9,6','2,8','3,8','2,9','3,9','8,10','9,10','8,11','9,11','4,6','5,6','6,6']);
const trees=new Set();for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){if((x===0||x===11||y===0||y===15)&&!(x===5&&y===0))trees.add(x+','+y);else if(Math.random()<.13&&!grass.has(x+','+y)&&!(x>4&&x<7&&y>5&&y<14))trees.add(x+','+y)}
function tile(x,y){return x+','+y}
function draw(){ctx.clearRect(0,0,W,H);for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){let k=tile(x,y);ctx.fillStyle=(x+y)%2?'#68a957':'#72b45d';ctx.fillRect(x*T,y*T,T,T);if(grass.has(k)){ctx.fillStyle='#397f3d';ctx.fillRect(x*T,y*T,T,T);for(let n=0;n<7;n++){let gx=x*T+5+(n*13)%30,gy=y*T+7+(n*17)%27;ctx.fillStyle=n%2?'#2c7137':'#4d9846';ctx.beginPath();ctx.ellipse(gx,gy,4,10,-.3,0,Math.PI*2);ctx.fill()}}if(trees.has(k)){ctx.fillStyle='#76502f';ctx.fillRect(x*T+15,y*T+20,10,19);ctx.fillStyle='#205c38';ctx.beginPath();ctx.arc(x*T+20,y*T+16,19,0,7);ctx.fill();ctx.fillStyle='#347a43';ctx.beginPath();ctx.arc(x*T+11,y*T+12,10,0,7);ctx.fill()}if(x===5&&y===0){ctx.fillStyle='#d9c99a';ctx.fillRect(x*T+5,y*T,30,40);ctx.fillStyle='#fff1c8';ctx.fillRect(x*T+12,y*T+8,16,22)}}}
function drawPlayer(){let x=px*T+20,y=py*T+20;ctx.fillStyle='#263b2d';ctx.beginPath();ctx.ellipse(x,y+12,13,6,0,0,7);ctx.fill();ctx.fillStyle='#6b3f26';ctx.fillRect(x-9,y-14,18,18);ctx.fillStyle='#e6ad78';ctx.fillRect(x-8,y-10,16,13);ctx.fillStyle='#75452c';ctx.fillRect(x-10,y-17,20,7);ctx.fillStyle='#315b9b';ctx.fillRect(x-10,y+3,20,13);ctx.fillStyle='#f3d6a2';ctx.fillRect(x-8,y+16,6,5);ctx.fillRect(x+3,y+16,6,5)}
function render(){draw();drawPlayer()}
function move(dx,dy){if(inBattle)return;let nx=Math.max(1,Math.min(10,px+dx)),ny=Math.max(1,Math.min(14,py+dy));if(trees.has(tile(nx,ny)))return;px=nx;py=ny;step++;render();if(ny===1&&nx===5){document.getElementById('mapStory').textContent='O caminho para a próxima região será aberto após vencer o guardião.';return}if(grass.has(tile(px,py))&&Math.random()<.24){startBattle();return}document.getElementById('mapStory').textContent='Ibrahim está explorando a floresta...';}
function startBattle(){inBattle=true;enemyHp=40;guard=false;doubleUsed=false;document.getElementById('explore').classList.add('hidden');document.getElementById('battle').classList.add('active');document.getElementById('battleStory').textContent='🌿 Um Guardião da Floresta apareceu!';updateBattle();}
function updateBattle(){document.getElementById('hpLabel').textContent=hp+'/120';document.getElementById('enemyLabel').textContent=enemyHp+'/40';document.getElementById('hpBar').style.width=(hp/120*100)+'%';document.getElementById('enemyBar').style.width=(enemyHp/40*100)+'%';document.getElementById('double').disabled=doubleUsed||enemyHp<=0;document.getElementById('attack').disabled=enemyHp<=0;document.getElementById('defend').disabled=enemyHp<=0;}
function enemyTurn(){if(enemyHp<=0)return;let damage=guard?5:12;guard=false;hp=Math.max(0,hp-damage);document.getElementById('battleStory').textContent='O Guardião atacou! Ibrahim perdeu '+damage+' pontos de vida.';if(hp===0){document.getElementById('battleStory').textContent='Ibrahim precisa descansar. Volte à exploração para tentar novamente.';hp=80}updateBattle();}
document.getElementById('attack').onclick=()=>{enemyHp=Math.max(0,enemyHp-16);document.getElementById('battleStory').textContent='⚔️ Ibrahim acertou um ataque!';updateBattle();if(enemyHp===0){document.getElementById('battleStory').textContent='🏆 Vitória! O Guardião foi derrotado!';return}setTimeout(enemyTurn,450)};
document.getElementById('defend').onclick=()=>{guard=true;document.getElementById('battleStory').textContent='🛡️ Ibrahim se preparou para defender o próximo golpe.';setTimeout(enemyTurn,450)};
document.getElementById('double').onclick=()=>{if(doubleUsed)return;doubleUsed=true;enemyHp=Math.max(0,enemyHp-30);document.getElementById('battleStory').textContent='🐶⚔️ Ataque Duplo! Ibrahim e seu companheiro atacaram juntos.';updateBattle();if(enemyHp===0){document.getElementById('battleStory').textContent='🏆 Vitória! O Guardião foi derrotado!';return}setTimeout(enemyTurn,450)};
document.getElementById('backpack').onclick=()=>document.getElementById('bag').classList.toggle('open');
document.getElementById('closeBag').onclick=()=>document.getElementById('bag').classList.remove('open');
document.getElementById('medicine').onclick=()=>{hp=Math.min(120,hp+35);document.getElementById('bag').classList.remove('open');document.getElementById('battleStory').textContent='🧪 Ibrahim recuperou 35 pontos de vida.';updateBattle();setTimeout(enemyTurn,450)};
document.getElementById('returnMap').onclick=()=>{inBattle=false;document.getElementById('battle').classList.remove('active');document.getElementById('explore').classList.remove('hidden');document.getElementById('bag').classList.remove('open');document.getElementById('mapStory').textContent='Continue explorando a floresta!';render()};
document.querySelectorAll('[data-dir]').forEach(b=>{let timer;const dir=b.dataset.dir,vec={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};const run=()=>move(...vec[dir]);b.addEventListener('pointerdown',e=>{e.preventDefault();run();timer=setInterval(run,170)});['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>clearInterval(timer)))});
window.addEventListener('keydown',e=>{const m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]};if(m[e.key]){e.preventDefault();move(...m[e.key])}});
render();
</script></body></html>
